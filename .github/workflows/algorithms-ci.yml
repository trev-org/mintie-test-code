name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  algorithms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithms
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: algorithms/package-lock.json
      - run: npm ci
      - run: npm run check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mintlify-info-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/mintlify-info-api/package-lock.json
      - run: npm ci
      - run: npm test
