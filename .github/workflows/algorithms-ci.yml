name: Algorithms CI

on:
  pull_request:
    paths:
      - "algorithms/**"
      - ".github/workflows/algorithms-ci.yml"
  push:
    branches:
      - main
    paths:
      - "algorithms/**"
      - ".github/workflows/algorithms-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: algorithms/package-lock.json
      - run: npm ci
      - run: npm run check
